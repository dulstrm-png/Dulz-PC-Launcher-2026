name: Build xD APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: 5. Generate Project (gen_xd.py)
        run: |
          python3 gen_xd.py
          ls -R xD | head -n 50

      - name: 6. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 7. Build Debug APK
        working-directory: xD
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 8. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xD-debug-apk
          path: xD/app/build/outputs/apk/debug/*.apk
