name: Build xD APK from ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - 'xD.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract xD.zip
        run: |
          if [ ! -f xD.zip ]; then echo "xD.zip nggak ada di root repo"; exit 1; fi
          unzip -q xD.zip -d .
          echo "--- struktur ---"
          find xD -type f | sort | head -50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: xD
        run: |
          if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon --stacktrace
          else gradle assembleDebug --no-daemon --stacktrace; fi

      - uses: actions/upload-artifact@v4
        with:
          name: xD-debug-apk
          path: xD/app/build/outputs/apk/debug/*.apk
          retention-days: 30
